name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

  # ── Unit & Integration Tests ─────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test
        env:
          NODE_ENV: test
          DATABASE_URL: file:./test.db
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: test-secret-min-32-chars-xxxxxxxxxx
          BETTER_AUTH_URL: http://localhost:4000

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/server/coverage/

  # ── Docker Build ─────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: complete-auth/server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build email worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: workers/email-worker/Dockerfile
          push: false
          tags: complete-auth/email-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── E2E Tests (Playwright) ───────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start server
        run: npm run dev:server &
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: file:./test.db
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: test-secret-min-32-chars-xxxxxxxxxx
          BETTER_AUTH_URL: http://localhost:4000
          APP_URL: http://localhost:3000

      - name: Start web
        run: npm run dev:web &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Wait for services
        run: |
          npx wait-on http://localhost:4000/health http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        run: npm run test:e2e -w apps/web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  # ── Security Audit ────────────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=high
